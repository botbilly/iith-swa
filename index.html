<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IITH Staff Welfare Association</title>

<!-- React CDN -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>

/* GENERAL */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f5f7fa;
}

/* HEADER */
header {
    position: fixed;
    width: 100%;
    background: #1f2d3d;
    color: white;
    padding: 12px 20px;
}

.nav {
    display: flex;
    justify-content: space-between;
}

.nav a {
    color: white;
    margin-left: 15px;
    text-decoration: none;
}

/* HERO */
.hero {
    margin-top: 60px;
    height: 40vh;
    background: #eaeff5;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* SECTIONS */
section {
    padding: 40px 20px;
    background: white;
    border-bottom: 1px solid #ddd;
}

h2 {
    border-left: 4px solid #c0392b;
    padding-left: 10px;
}

/* NOTICE */
.notice {
    background: #f8f9fa;
    padding: 10px;
    margin: 10px 0;
}

/* BUTTONS */
.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.btn {
    padding: 10px 15px;
    background: #1f2d3d;
    color: white;
    border: none;
}

/* TABLE */
.tables {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #f8f9fa;
}

th, td {
    padding: 10px;
    border: 1px solid #ccc;
}

/* FOOTER */
footer {
    background: #1f2d3d;
    color: white;
    text-align: center;
    padding: 10px;
}

/* MOBILE */
@media (max-width: 768px) {
    .tables {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function App() {
    return (
        <div>

            {/* HEADER */}
            <header>
                <div className="nav">
                    <div>Home</div>
                    <div>
                        <a href="#about">About</a>
                        <a href="#workflow">Workflow</a>
                        <a href="#notices">Notices</a>
                        <a href="#contact">Contact</a>
                    </div>
                </div>
            </header>

            {/* HERO */}
            <section className="hero">
                <h1>IITH Staff Welfare Association</h1>
                <p>Committed to community welfare and transparency</p>
            </section>

            {/* ABOUT */}
            <section id="about">
                <h2>About</h2>
                <p>Association focused on staff welfare and coordination.</p>
            </section>

            {/* WORKFLOW */}
            <section id="workflow">
                <h2>Work Procedure</h2>
                <ol>
                    <li>Submit request</li>
                    <li>Review</li>
                    <li>Discussion</li>
                    <li>Decision</li>
                    <li>Action</li>
                </ol>
            </section>

            {/* NOTICES */}
            <section id="notices">
                <h2>Notices</h2>
                <div className="notice">
                    <strong>01 Jan 2026</strong>
                    <p>Meeting at 10 AM</p>
                </div>
                <div className="notice">
                    <strong>28 Dec 2025</strong>
                    <p>Maintenance work</p>
                </div>
            </section>

            {/* RESOURCES */}
            <section>
                <h2>Resources</h2>
                <div className="btn-group">
                    <button className="btn">Members List</button>
                    <button className="btn">Representations</button>
                    <button className="btn">Audit Reports</button>
                    <button className="btn">Meetings</button>
                </div>
            </section>

            {/* TABLES */}
            <section className="tables">
                <div>
                    <h3>Executive Committee</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Position</th>
                                <th>Name</th>
                                <th>Email</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>President</td>
                                <td>Vanama Raju</td>
                                <td>Email</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div>
                    <h3>Members</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Ajith</td>
                                <td>Email</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            {/* CONTACT */}
            <section id="contact">
                <h2>Contact</h2>
                <p>staff.association@iith.ac.in</p>
            </section>

            <footer>© 2026 IITH Welfare Association</footer>

        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
